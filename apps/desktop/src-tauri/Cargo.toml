[package]
name = "kingpost-connect"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true
description = "KingPost Connect desktop application"

[lib]
name = "kingpost_connect_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2.14"
tauri-plugin-process = "2.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
time = { workspace = true, features = ["macros", "formatting"] }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
base64.workspace = true
notify.workspace = true
kp-project = { path = "../../../crates/kp-project" }
kp-store = { path = "../../../crates/kp-store" }
kp-ifc = { path = "../../../crates/kp-ifc" }
kp-bcf = { path = "../../../crates/kp-bcf" }
kp-diff = { path = "../../../crates/kp-diff" }
kp-analysis = { path = "../../../crates/kp-analysis" }
kp-licence = { path = "../../../crates/kp-licence" }
kp-quantity = { path = "../../../crates/kp-quantity" }
kp-sync = { path = "../../../crates/kp-sync" }
sha2.workspace = true

[dev-dependencies]
tempfile.workspace = true
