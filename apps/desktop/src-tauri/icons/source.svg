<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- KingPost Connect: a king post truss on a slate tile. Source for `tauri icon`. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2129"/>
      <stop offset="1" stop-color="#0e1116"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <g fill="none" stroke="#e7eaef" stroke-width="56" stroke-linecap="round" stroke-linejoin="round">
    <!-- tie beam -->
    <path d="M200 720 H824"/>
    <!-- rafters -->
    <path d="M200 720 L512 304 L824 720"/>
    <!-- king post -->
    <path d="M512 304 V720"/>
    <!-- struts -->
    <path d="M512 560 L356 720 M512 560 L668 720"/>
  </g>
  <!-- joint markers in accent -->
  <g fill="#5b9dff">
    <circle cx="512" cy="304" r="44"/>
    <circle cx="200" cy="720" r="44"/>
    <circle cx="824" cy="720" r="44"/>
    <circle cx="512" cy="720" r="44"/>
  </g>
</svg>
